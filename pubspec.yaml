name: marky
description: Marky - Offline-first personal link manager
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  cached_network_image: ^3.4.1
  crypto: ^3.0.6
  dio: ^5.8.0+1
  file_picker: ^10.1.2
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_local_notifications: ^19.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_timezone: ^4.1.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  html: ^0.15.5
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  meta: ^1.15.0
  mobile_scanner: ^6.0.0
  package_info_plus: ^8.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  receive_sharing_intent: ^1.8.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  timezone: ^0.10.0
  url_launcher: ^6.3.1

dev_dependencies:
  # Code Generation
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/marky_logo.png
