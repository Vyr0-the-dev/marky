appId: com.marky.app.marky
---
- launchApp
- extendedWaitUntil:
    visible: "Marky"
    timeout: 15000
- tapOn: "Search"
- assertVisible: "Search bookmarks..."
- pressKey: BACK
- tapOn: "Library"
- assertVisible: "Library"
- assertVisible: "Tags"
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "Home"
- assertVisible: "Marky"
