name: Marky CI & Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Check if release should build
        id: release_check
        run: |
          IS_RELEASE="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IS_RELEASE="true"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IS_RELEASE="true"
          elif [[ "${{ contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[apk]') }}" == "true" ]]; then
            IS_RELEASE="true"
          fi
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.release_check.outputs.is_release == 'true'
        run: flutter build apk --release

      - name: Resolve release tag
        if: steps.release_check.outputs.is_release == 'true'
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//' | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "marky-$TAG.apk"

      - name: Upload APK artifact
        if: steps.release_check.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marky-${{ steps.meta.outputs.tag }}-apk
          path: marky-${{ steps.meta.outputs.tag }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.release_check.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          APK="marky-$TAG.apk"
          cat > release_notes.md <<'EOF'
          Offline-first personal link manager for Android.

          ### Install
          Download the `.apk` below and open it on your Android device (allow installs from unknown sources).

          ### Highlights
          - Reading Room UI with warm dark, light and OLED themes
          - Home screen widget with Quick Add and Search
          - Cover image controls: view, change URL, remove
          - Reader mode with clean typography
          - Search operators: `tag:`, `domain:`, `source:`, `is:favorite`
          - 100% local Isar database, no cloud
          - JSON backup and Netscape HTML import/export
          EOF

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file release_notes.md --latest
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Marky $TAG" \
              --notes-file release_notes.md \
              --latest
          fi
